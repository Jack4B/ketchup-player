name: CI
on:
  push:
    branches: [main, 'faza-*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Weryfikacja reguł modułów (build-logic)
        run: ./gradlew -p build-logic :convention:test
      - name: Reguły zależności modułów
        run: ./gradlew verifyModuleDependencies
      - name: Spotless + Detekt
        run: ./gradlew spotlessCheck detekt
      - name: Testy jednostkowe
        run: ./gradlew testDebugUnitTest test
      - name: Roborazzi (verify; bez baseline - record)
        run: |
          if [ -n "$(find . -path '*/src/test/screenshots/*.png' -print -quit)" ]; then
            ./gradlew verifyRoborazziDebug
          else
            ./gradlew recordRoborazziDebug
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            **/src/test/screenshots
            **/build/outputs/roborazzi
      - name: Lint
        run: ./gradlew lintDebug
      - name: Build debug
        run: ./gradlew :app:assembleDebug
      - name: Build release (R8)
        run: ./gradlew :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
