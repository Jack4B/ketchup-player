name: CI
on:
  push:
    branches: [main, 'faza-*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Weryfikacja reguł modułów (build-logic)
        run: ./gradlew -p build-logic :convention:test
      - name: Reguły zależności modułów
        run: ./gradlew verifyModuleDependencies
      - name: Spotless + Detekt
        run: ./gradlew spotlessCheck detekt
      - name: Testy jednostkowe
        run: ./gradlew testDebugUnitTest :core:model:test :core:policy:test :epg:radar:test :provider:api:test
      - name: Roborazzi (faza-* nagrywa baseline, PR i main weryfikują)
        run: |
          if [[ "${GITHUB_REF_NAME}" == faza-* ]]; then
            ./gradlew recordRoborazziDebug
          else
            ./gradlew verifyRoborazziDebug
          fi
      - name: Commit baseline Roborazzi (tylko gdy dopiero co nagrany)
        if: github.event_name == 'push' && startsWith(github.ref_name, 'faza-')
        run: |
          git add -A -- '*/src/test/screenshots/*.png'
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: baseline Roborazzi (CI)"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            **/src/test/screenshots
            **/build/outputs/roborazzi
      - name: Lint
        run: ./gradlew lintDebug
      - name: Build debug
        run: ./gradlew :app:assembleDebug
      - name: Build release (R8)
        run: ./gradlew :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk
  emulator:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Włącz KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: ./gradlew :app:assembleDebug
      - name: Emulator Android TV (API 34) - smoke D-pad
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          script: .github/scripts/emulator-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshots
          path: docs/qa/emulator
      - name: Commit zrzutów z emulatora
        if: always() && github.event_name == 'push' && startsWith(github.ref_name, 'faza-')
        run: |
          git add -A -- docs/qa/emulator
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: zrzuty z emulatora Android TV (CI)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
