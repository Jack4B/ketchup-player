name: Release

# Wydanie: tag `v*` (np. v1.0.0) albo ręcznie. Buduje podpisany APK i dołącza go do GitHub Release.
# Wymagane sekrety repozytorium (opis w docs/RELEASE.md):
#   KETCHUP_KEYSTORE_BASE64, KETCHUP_KEYSTORE_PASSWORD, KETCHUP_KEY_ALIAS, KETCHUP_KEY_PASSWORD
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Wersja, np. 1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Wersja
        id: ver
        run: |
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ]; then V="${GITHUB_REF_NAME#v}"; fi
          IFS=. read -r MAJ MIN PAT <<< "$V"
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$((MAJ * 10000 + MIN * 100 + PAT))" >> "$GITHUB_OUTPUT"
      - name: Klucz podpisu (z sekretu)
        env:
          KEYSTORE_B64: ${{ secrets.KETCHUP_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "Brak sekretu KETCHUP_KEYSTORE_BASE64 (patrz docs/RELEASE.md)"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ketchup.jks"
          echo "KETCHUP_KEYSTORE_FILE=$RUNNER_TEMP/ketchup.jks" >> "$GITHUB_ENV"
      - name: Build podpisany APK (R8)
        env:
          KETCHUP_KEYSTORE_PASSWORD: ${{ secrets.KETCHUP_KEYSTORE_PASSWORD }}
          KETCHUP_KEY_ALIAS: ${{ secrets.KETCHUP_KEY_ALIAS }}
          KETCHUP_KEY_PASSWORD: ${{ secrets.KETCHUP_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PversionName=${{ steps.ver.outputs.name }} -PversionCode=${{ steps.ver.outputs.code }}
      - name: Nazwa pliku
        run: cp app/build/outputs/apk/release/app-release.apk "KetchupPlayer-${{ steps.ver.outputs.name }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: KetchupPlayer-${{ steps.ver.outputs.name }}
          path: KetchupPlayer-${{ steps.ver.outputs.name }}.apk
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: Ketchup Player ${{ steps.ver.outputs.name }}
          files: KetchupPlayer-${{ steps.ver.outputs.name }}.apk
