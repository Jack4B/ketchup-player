build:
  maxIssues: 0
exceptions:
  SwallowedException: { active: true }
  TooGenericExceptionCaught: { active: true }
empty-blocks:
  EmptyCatchBlock: { active: true, allowedExceptionNameRegex: '^$' }
naming:
  FunctionNaming: { active: true, ignoreAnnotated: ['Composable'] }
complexity:
  TooManyFunctions: { active: true, thresholdInClasses: 11, ignoreOverridden: true }
  # Funkcje @Composable mają wiele parametrów z wartościami domyślnymi (Modifier, kolory) - liczymy tylko wymagane.
  LongParameterList: { active: true, functionThreshold: 6, constructorThreshold: 8, ignoreDefaultParameters: true }
style:
  ReturnCount: { active: true, max: 6, excludeGuardClauses: true }
  MagicNumber: { active: false }
  WildcardImport: { active: true }
  MaxLineLength: { active: true, maxLineLength: 120 }
